<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Predefined Messages Settings</title>

  <style>
    body {
      max-width: 750px;
      margin: 40px auto;
      padding: 0 20px;
      font-family: Arial, sans-serif;
      line-height: 1.5;
    }

    h1 {
      margin-bottom: 8px;
    }

    .description {
      color: #666;
      margin-bottom: 30px;
    }

    .prompt-group {
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .shortcut {
      font-size: 12px;
      font-weight: normal;
      color: #777;
      margin-left: 8px;
    }

    textarea {
      width: 100%;
      height: 130px;
      box-sizing: border-box;
      padding: 12px;
      font-size: 14px;
      font-family: inherit;
      resize: vertical;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    textarea:focus {
      outline: 2px solid #4285f4;
      outline-offset: 1px;
    }

    button {
      padding: 12px 24px;
      font-size: 14px;
      cursor: pointer;
    }

    #status {
      margin-top: 12px;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <h1>Predefined Messages</h1>

  <p class="description">
    Configure up to three messages that can be sent
    directly to ChatGPT using keyboard shortcuts.
  </p>

  <div class="prompt-group">
    <label for="prompt1">
      Message 1
      <span class="shortcut">Ctrl + Shift + 1</span>
    </label>

    <textarea
      id="prompt1"
      placeholder="Enter predefined message 1..."
    ></textarea>
  </div>

  <div class="prompt-group">
    <label for="prompt2">
      Message 2
      <span class="shortcut">Ctrl + Shift + 2</span>
    </label>

    <textarea
      id="prompt2"
      placeholder="Enter predefined message 2..."
    ></textarea>
  </div>

  <div class="prompt-group">
    <label for="prompt3">
      Message 3
      <span class="shortcut">Ctrl + Shift + 3</span>
    </label>

    <textarea
      id="prompt3"
      placeholder="Enter predefined message 3..."
    ></textarea>
  </div>

  <button id="saveButton">
    Save Messages
  </button>

  <p id="status" role="status"></p>

  <script src="options.js"></script>
</body>
</html>
